<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products & CRUD — Urban Rich Admin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
  <style>
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="admin-header">
    <div class="header-left">
      <button class="menu-trigger-btn" onclick="openDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="brand-logo"><img src="images/logo.jpg" alt="Urban Rich Logo"><span class="brand-name">URBAN RICH ADMIN</span></div>
    </div>
  </header>

  <!-- DESKTOP NAV TABS -->
  <nav class="admin-nav-tabs">
    <a href="index.html" class="admin-nav-tab">Dashboard</a>
    <a href="orders.html" class="admin-nav-tab">Orders</a>
    <a href="all-products.html" class="admin-nav-tab active">All Products</a>
    <a href="add-product.html" class="admin-nav-tab">Add Product</a>
    <a href="users.html" class="admin-nav-tab">Users</a>
    <a href="add-banner.html" class="admin-nav-tab">Add Banner</a>
  </nav>

  <main class="admin-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700;">INVENTORY CATALOG & PRODUCT MANAGEMENT</h2>
      <a href="add-product.html" class="btn-admin">+ ADD NEW PRODUCT</a>
    </div>

    <div class="admin-table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Image</th>
            <th>Title</th>
            <th>Price (₹)</th>
            <th>MRP (₹)</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryBody">
          <tr><td colspan="6" style="text-align: center; color: #999;">Loading products...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- EDIT PRODUCT MODAL (#editModal) -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700;">EDIT PRODUCT</h3>
        <button onclick="closeEditModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <form id="editProductForm">
        <input type="hidden" id="editProdId">
        <div class="form-group">
          <label>Product Title *</label>
          <input type="text" id="editProdName" class="form-control" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Price (₹) *</label>
            <input type="number" step="0.01" id="editProdPrice" class="form-control" required>
          </div>
          <div class="form-group">
            <label>MRP (₹) *</label>
            <input type="number" step="0.01" id="editProdMrp" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label>Status *</label>
          <select id="editProdStatus" class="form-control">
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="editProdDesc" rows="3" class="form-control"></textarea>
        </div>
        <div class="form-group">
          <label>Update Image (Optional Upload)</label>
          <input type="file" id="editProdImgFile" class="form-control" accept="image/*">
        </div>
        <button type="submit" class="btn-admin" style="width: 100%;">SAVE CHANGES</button>
      </form>
    </div>
  </div>

  <!-- FIXED MOBILE BOTTOM TASKBAR -->
  <nav class="admin-mobile-taskbar">
    <a href="index.html" class="admin-taskbar-tab">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="orders.html" class="admin-taskbar-tab">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Orders</span>
    </a>
    <a href="all-products.html" class="admin-taskbar-tab active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Products</span>
    </a>
    <a href="users.html" class="admin-taskbar-tab">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Users</span>
    </a>
    <button class="admin-taskbar-tab" onclick="openDrawer()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <!-- SETTINGS DRAWER -->
  <div class="drawer-overlay" id="adminDrawer" onclick="closeDrawer(event)">
    <div class="drawer-left" onclick="event.stopPropagation()">
      <div class="drawer-header"><span class="drawer-title">ADMIN SETTINGS</span><button class="menu-trigger-btn" onclick="closeDrawer()">✕</button></div>
      <div class="drawer-body" style="display: flex; flex-direction: column; gap: 12px;">
        <a href="add-product.html" class="btn-admin" style="text-align: center;">+ ADD NEW PRODUCT</a>
        <a href="add-banner.html" class="btn-admin" style="text-align: center; background: #333;">MANAGE HERO BANNERS</a>
        <button class="btn-admin" id="pushNotifyBtn" onclick="requestAdminNotificationPermission()" style="width: 100%; background: #0077b6;">ALLOW ORDER NOTIFICATIONS</button>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];

    async function loadInventory() {
      const tbody = document.getElementById('inventoryBody');
      try {
        const { data: products, error } = await window.fetchAdminProducts();
        if (error && (!products || products.length === 0)) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Error loading products: ${error.message || 'Unknown error'}</td></tr>`;
          return;
        }

        allProducts = products || [];

        if (allProducts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">No products found in inventory.</td></tr>';
          return;
        }

        tbody.innerHTML = allProducts.map(p => `
          <tr>
            <td><img src="${p.main_image || 'images/logo.jpg'}" style="width: 44px; height: 55px; object-fit: cover; border-radius: 4px;"></td>
            <td><strong>${p.name}</strong></td>
            <td>₹${p.price}</td>
            <td>₹${p.mrp || '-'}</td>
            <td><span class="status-badge ${p.status === 'published' ? 'badge-delivered' : 'badge-cancelled'}">${p.status}</span></td>
            <td style="display: flex; gap: 8px;">
              <button onclick="openEditModal('${p.id}')" style="background: var(--text-dark); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 700; cursor: pointer;">EDIT</button>
              <button onclick="deleteProduct('${p.id}')" style="background: var(--accent-red); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 700; cursor: pointer;">DELETE</button>
            </td>
          </tr>
        `).join('');
      } catch(e) { console.error(e); }
    }

    function openEditModal(id) {
      const p = allProducts.find(item => item.id === id);
      if (!p) return;
      document.getElementById('editProdId').value = p.id;
      document.getElementById('editProdName').value = p.name || '';
      document.getElementById('editProdPrice').value = p.price || '';
      document.getElementById('editProdMrp').value = p.mrp || '';
      document.getElementById('editProdStatus').value = p.status || 'published';
      document.getElementById('editProdDesc').value = p.description || '';
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    document.getElementById('editProductForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const id = document.getElementById('editProdId').value;
      const name = document.getElementById('editProdName').value;
      const price = parseFloat(document.getElementById('editProdPrice').value);
      const mrp = parseFloat(document.getElementById('editProdMrp').value);
      const status = document.getElementById('editProdStatus').value;
      const description = document.getElementById('editProdDesc').value;

      const fileInput = document.getElementById('editProdImgFile');
      let updatePayload = { name, price, mrp, status, description, updated_at: new Date() };

      if (fileInput.files.length > 0) {
        const uploadedUrl = await window.uploadProductImage(fileInput);
        if (uploadedUrl) updatePayload.main_image = uploadedUrl;
      }

      const client = window.urSbClient || window.adminSupabase;
      if (client) {
        const { error } = await client.from('products').update(updatePayload).eq('id', id);
        if (error) {
          window.adminToast('Error updating product: ' + error.message);
        } else {
          window.adminToast('Product updated successfully!');
          closeEditModal();
          loadInventory();
        }
      }
    });

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      const client = window.urSbClient || window.adminSupabase;
      if (client) {
        const { error } = await client.from('products').delete().eq('id', id);
        if (error) {
          window.adminToast('Delete error: ' + error.message);
        } else {
          window.adminToast('Product deleted from inventory.');
          loadInventory();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadInventory();
      document.addEventListener('adminSupabaseReady', loadInventory);
    });
  </script>
</body>
</html>
